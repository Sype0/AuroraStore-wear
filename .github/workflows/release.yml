#
# Builds the signed Aurora Wear APK and publishes it as a GitHub release on every push to
# master (or when started by hand from the Actions tab).
#
# Required repository secrets:
#   KEYSTORE_BASE64  release keystore, base64 encoded
#   KEY_ALIAS        key alias inside the keystore
#   KEY_PASSWORD     keystore and key password

name: Build and release

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Prepare signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > app/release.jks
          printf 'KEY_ALIAS=%s\nKEY_PASSWORD=%s\nSTORE_FILE=release.jks\n' \
            "$KEY_ALIAS" "$KEY_PASSWORD" > signing.properties

      - name: Build APK
        run: ./gradlew assembleVanillaRelease --no-daemon --stacktrace

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(grep -m1 'versionName = ' app/build.gradle.kts | cut -d'"' -f2)
          tag="v${version}-wear.${GITHUB_RUN_NUMBER}"
          apk="AuroraWear-${tag}.apk"
          cp app/build/outputs/apk/vanilla/release/app-vanilla-release.apk "$apk"
          gh release create "$tag" "$apk" \
            --target "$GITHUB_SHA" \
            --title "Aurora Wear ${tag}" \
            --notes "Aurora Store ${version} tabanlı Wear OS sürümü. Commit: ${GITHUB_SHA::7}"

      - name: Remove signing key
        if: always()
        run: rm -f app/release.jks signing.properties
